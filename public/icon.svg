<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2825"/>
      <stop offset="100%" stop-color="#181614"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e27c44"/>
      <stop offset="100%" stop-color="#d95d39"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f2ede4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base App Background (Squircle) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Subtle Inner Ring -->
  <rect x="24" y="24" width="464" height="464" rx="95" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Main Ambient Card -->
  <g filter="url(#shadow)">
    <rect x="96" y="96" width="320" height="320" rx="48" fill="url(#accentGrad)"/>
    
    <!-- Accent Color Header Band -->
    <path d="M 96 144 C 96 117.49 117.49 96 144 96 L 368 96 C 394.51 96 416 117.49 416 144 L 416 180 L 96 180 Z" fill="url(#cardGrad)"/>
    
    <!-- Calendar Rings -->
    <rect x="160" y="74" width="24" height="44" rx="12" fill="#2c2825"/>
    <rect x="328" y="74" width="24" height="44" rx="12" fill="#2c2825"/>

    <!-- Checklist / Activity Elements inside the card -->
    <!-- Task Row 1 -->
    <circle cx="152" cy="236" r="16" fill="#e27c44"/>
    <path d="M 145 236 L 150 241 L 159 231" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="186" y="228" width="160" height="16" rx="8" fill="#2c2825" opacity="0.85"/>

    <!-- Task Row 2 -->
    <circle cx="152" cy="286" r="16" fill="#e27c44"/>
    <path d="M 145 286 L 150 291 L 159 281" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="186" y="278" width="120" height="16" rx="8" fill="#2c2825" opacity="0.85"/>

    <!-- Task Row 3 (In progress spark) -->
    <circle cx="152" cy="336" r="16" fill="none" stroke="#d5cebf" stroke-width="3"/>
    <rect x="186" y="328" width="180" height="16" rx="8" fill="#a89f91" opacity="0.6"/>

    <!-- Sparkling Sun / Star Badge in corner -->
    <g transform="translate(356, 356)">
      <circle cx="0" cy="0" r="28" fill="url(#cardGrad)"/>
      <path d="M 0 -14 L 3 -4 L 14 0 L 3 4 L 0 14 L -3 4 L -14 0 L -3 -4 Z" fill="#ffffff"/>
    </g>
  </g>
</svg>
